<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-slate-800">Home Page Banners</h1>
    <button class="btn btn-primary bg-saowari-primary text-white border-none hover:bg-saowari-primary-dark" (click)="openAddModal()">
      <i class="fas fa-plus mr-2"></i> Add New Banner
    </button>
  </div>

  <div *ngIf="isLoading" class="flex justify-center py-10">
    <span class="loading loading-spinner loading-lg text-saowari-primary"></span>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let banner of banners" class="card bg-white shadow-xl overflow-hidden border border-slate-100 transition-all hover:shadow-2xl">
      <figure class="relative h-48 w-full bg-slate-100">
        <img [src]="banner.imageUrl" alt="Banner Image" class="w-full h-full object-cover" />
        <div class="absolute top-2 right-2">
          <div class="badge" [ngClass]="banner.isActive ? 'badge-success text-white' : 'badge-error text-white'">
            {{ banner.isActive ? 'Active' : 'Inactive' }}
          </div>
        </div>
        <div class="absolute top-2 left-2">
          <div class="badge badge-info text-white font-bold">{{ banner.position === 'UpcomingTrips' ? 'Upcoming Trips' : 'Popular Routes' }}</div>
        </div>
      </figure>
      <div class="card-body p-4">
        <h2 class="card-title text-lg mb-1 text-slate-800">{{ banner.title || 'Untitled Banner' }}</h2>
        <p class="text-xs text-slate-500 mb-4 truncate">{{ banner.linkUrl || 'No link specified' }}</p>
        <div class="card-actions justify-end">
          <button class="btn btn-sm btn-outline btn-info" (click)="openEditModal(banner)">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button class="btn btn-sm btn-outline btn-error" (click)="deleteBanner(banner.bannerId)">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      </div>
    </div>
    
    <div *ngIf="banners.length === 0" class="col-span-full text-center py-12 text-slate-500 bg-slate-50 rounded-xl">
      <i class="fas fa-images text-4xl mb-3 opacity-50"></i>
      <p>No banners found. Click "Add New Banner" to create one.</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" [class.modal-open]="isModalOpen">
  <div class="modal-box max-w-2xl bg-white">
    <h3 class="font-bold text-lg mb-6 text-slate-800">{{ isEditing ? 'Edit Banner' : 'Add New Banner' }}</h3>
    
    <form (ngSubmit)="saveBanner()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div class="form-control">
          <label class="label"><span class="label-text font-semibold text-slate-700">Position *</span></label>
          <select class="select select-bordered w-full text-slate-800 bg-white" [(ngModel)]="bannerForm.position" name="position" required>
            <option value="TopHero">Top Hero Section (Above Search)</option>
            <option value="UpcomingTrips">Upcoming Trips Section (Flanks & Bottom)</option>
            <option value="PopularRoutes">Popular Routes Section (Flanks & Bottom)</option>
            <option value="MiddleContent">Middle Content Section (Full Width)</option>
            <option value="TransportPartners">Transport Partners Section (Flanks & Bottom)</option>
          </select>
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-semibold text-slate-700">Size Template *</span></label>
          <select class="select select-bordered w-full text-slate-800 bg-white" [(ngModel)]="bannerForm.sizeTemplate" name="sizeTemplate" required>
            <option value="Horizontal">Horizontal Wide (900x220px)</option>
            <option value="Standard">Standard (480x270px)</option>
            <option value="Square">Square Side-Banner (220x220px)</option>
            <option value="Vertical">Vertical Side-Banner (200x355px)</option>
          </select>
        </div>
      </div>

      <div class="form-control mb-4">
        <label class="label"><span class="label-text font-semibold text-slate-700">Title (Optional)</span></label>
        <input type="text" class="input input-bordered w-full text-slate-800 bg-white" [(ngModel)]="bannerForm.title" name="title" placeholder="Banner Title" />
      </div>

      <div class="form-control mb-4">
        <label class="label"><span class="label-text font-semibold text-slate-700">Link URL (Optional)</span></label>
        <input type="url" class="input input-bordered w-full text-slate-800 bg-white" [(ngModel)]="bannerForm.linkUrl" name="linkUrl" placeholder="https://..." />
      </div>

      <div class="form-control mb-6">
        <label class="label">
          <span class="label-text font-semibold text-slate-700">Banner Image {{ !isEditing ? '*' : '' }}</span>
        </label>
        
        <div class="flex items-center justify-center w-full mt-2">
          <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 relative overflow-hidden">
            
            <div class="flex flex-col items-center justify-center pt-5 pb-6" *ngIf="!imagePreview">
              <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-3"></i>
              <p class="mb-2 text-sm text-slate-500"><span class="font-semibold">Click to upload</span></p>
              <p class="text-xs text-slate-500 font-bold text-saowari-primary mt-1">
                <ng-container *ngIf="bannerForm.sizeTemplate === 'Horizontal'">Best: 900x220px</ng-container>
                <ng-container *ngIf="bannerForm.sizeTemplate === 'Standard'">Best: 480x270px</ng-container>
                <ng-container *ngIf="bannerForm.sizeTemplate === 'Square'">Best: 220x220px</ng-container>
                <ng-container *ngIf="bannerForm.sizeTemplate === 'Vertical'">Best: 200x355px</ng-container>
              </p>
            </div>
            
            <img *ngIf="imagePreview" [src]="imagePreview" class="absolute inset-0 w-full h-full object-cover opacity-60 hover:opacity-30 transition-opacity" />
            <div *ngIf="imagePreview" class="absolute inset-0 flex items-center justify-center pointer-events-none text-white font-bold text-shadow">Change Image</div>
            
            <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" />
          </label>
        </div>
      </div>

      <div class="form-control mb-6">
        <label class="label cursor-pointer justify-start gap-4">
          <input type="checkbox" class="toggle toggle-success" [(ngModel)]="bannerForm.isActive" name="isActive" />
          <span class="label-text font-semibold text-slate-700">Active (Visible on Home Page)</span>
        </label>
      </div>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost text-slate-700" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary bg-saowari-primary text-white border-none">Save Banner</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button (click)="closeModal()">close</button>
  </form>
</div>

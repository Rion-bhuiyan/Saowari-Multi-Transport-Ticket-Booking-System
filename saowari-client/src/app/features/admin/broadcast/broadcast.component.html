<div class="p-6 max-w-4xl mx-auto">
  <div class="bg-saowari-surface rounded-2xl shadow-sm border border-saowari-border overflow-hidden">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-5">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fas fa-bullhorn text-blue-200"></i>
        Broadcast Promotional Message
      </h2>
      <p class="text-blue-100 text-sm mt-1">Send a notice via email and in-app notifications to specific user groups.</p>
    </div>

    <div class="p-6">
      <!-- Success/Error Messages -->
      <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 text-green-700 rounded-xl border border-green-200 flex items-start gap-3">
        <i class="fas fa-check-circle mt-0.5"></i>
        <p>{{ successMessage }}</p>
      </div>
      
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 flex items-start gap-3">
        <i class="fas fa-exclamation-circle mt-0.5"></i>
        <p>{{ errorMessage }}</p>
      </div>

      <form (ngSubmit)="onSubmit()" #broadcastForm="ngForm" class="space-y-6">
        
        <!-- Target Roles -->
        <div>
          <label class="block text-sm font-semibold text-saowari-text-primary mb-3">Target Audience <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <label *ngFor="let role of roles" class="flex items-center p-3 border border-saowari-border rounded-xl cursor-pointer hover:bg-saowari-surface-alt transition-colors">
              <input type="checkbox" 
                     class="w-4 h-4 text-blue-600 rounded border-saowari-border focus:ring-blue-500"
                     [checked]="selectedRoleIds.includes(role.userRoleId)"
                     (change)="toggleRole(role.userRoleId, $event)">
              <span class="ml-3 text-sm font-medium text-saowari-text-primary">{{ role.userRoleName }}</span>
            </label>
          </div>
        </div>

        <hr class="border-saowari-border">

        <!-- Subject -->
        <div>
          <label class="block text-sm font-semibold text-saowari-text-primary mb-2">Subject <span class="text-red-500">*</span></label>
          <input type="text" 
                 [(ngModel)]="subject" 
                 name="subject" 
                 required
                 class="w-full px-4 py-3 rounded-xl border border-saowari-border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm outline-none"
                 placeholder="e.g., 50% Off Eid Special Offer!">
        </div>

        <!-- Promotional Image -->
        <div>
          <label class="block text-sm font-semibold text-saowari-text-primary mb-2">Promotional Image (Optional)</label>
          
          <div *ngIf="!imagePreview" class="border-2 border-dashed border-saowari-border rounded-xl p-8 text-center hover:bg-saowari-surface-alt transition-colors">
            <input type="file" id="broadcastImage" class="hidden" (change)="onImageSelected($event)" accept="image/*">
            <label for="broadcastImage" class="cursor-pointer">
              <i class="fas fa-image text-4xl text-gray-400 mb-3 block"></i>
              <span class="text-blue-600 font-medium hover:text-blue-700">Browse</span>
              <span class="text-saowari-text-secondary"> or drag and drop</span>
              <p class="text-xs text-gray-400 mt-2">PNG, JPG up to 5MB</p>
            </label>
          </div>

          <div *ngIf="imagePreview" class="relative inline-block mt-2">
            <img [src]="imagePreview" class="h-48 object-cover rounded-xl border border-saowari-border shadow-sm">
            <button type="button" 
                    (click)="removeImage()"
                    class="absolute -top-2 -right-2 w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center hover:bg-red-600 shadow-md transition-colors">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- Message Body -->
        <div>
          <label class="block text-sm font-semibold text-saowari-text-primary mb-2">Message Content <span class="text-red-500">*</span></label>
          <textarea [(ngModel)]="message" 
                    name="message" 
                    required
                    rows="6"
                    class="w-full px-4 py-3 rounded-xl border border-saowari-border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm outline-none resize-y"
                    placeholder="Write your beautiful promotional message or urgent notice here..."></textarea>
        </div>

        <!-- Actions -->
        <div class="pt-4 border-t border-saowari-border flex justify-end gap-3">
          <button type="button" 
                  (click)="resetForm()"
                  class="px-6 py-2.5 rounded-xl border border-saowari-border text-saowari-text-primary font-medium hover:bg-saowari-surface-alt transition-colors">
            Clear
          </button>
          <button type="submit" 
                  [disabled]="isSubmitting"
                  class="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 shadow-sm shadow-blue-200 transition-all flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
            <i *ngIf="isSubmitting" class="fas fa-circle-notch fa-spin"></i>
            <i *ngIf="!isSubmitting" class="fas fa-paper-plane"></i>
            {{ isSubmitting ? 'Sending...' : 'Send Broadcast' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

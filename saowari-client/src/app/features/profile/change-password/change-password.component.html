<div class="bg-saowari-surface-alt min-h-screen pt-24 pb-12">
  <div class="container mx-auto px-4 max-w-xl">
    <div class="mb-8">
      <h1 class="text-3xl font-heading font-bold text-saowari-text-primary">Change Password</h1>
      <p class="text-saowari-text-secondary mt-1">Keep your account safe with a strong password.</p>
    </div>

    <div class="bg-saowari-surface rounded-2xl shadow-sm border border-saowari-border p-8">
      <form #cpForm="ngForm" (ngSubmit)="onSave()">

        <!-- Current Password -->
        <div class="form-control mb-5">
          <label class="label pb-1"><span class="label-text font-semibold">Current Password</span></label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input [type]="showCurrent ? 'text' : 'password'" name="current" [(ngModel)]="model.currentPassword" required
                   class="input input-bordered w-full pl-11 pr-12 focus:border-saowari-primary" placeholder="Enter current password">
            <button type="button" (click)="showCurrent = !showCurrent" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-saowari-text-secondary">
              <i [class]="showCurrent ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="form-control mb-2">
          <label class="label pb-1"><span class="label-text font-semibold">New Password</span></label>
          <div class="relative">
            <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input [type]="showNew ? 'text' : 'password'" name="newPass" [(ngModel)]="model.newPassword" required minlength="8"
                   class="input input-bordered w-full pl-11 pr-12 focus:border-saowari-primary" placeholder="Minimum 8 characters">
            <button type="button" (click)="showNew = !showNew" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-saowari-text-secondary">
              <i [class]="showNew ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Password Strength Meter -->
        <div class="mb-5" *ngIf="model.newPassword">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-gray-400">Password strength</span>
            <span class="text-xs font-semibold"
                  [ngClass]="{'text-red-400': passwordStrength < 2, 'text-yellow-500': passwordStrength === 2, 'text-blue-500': passwordStrength === 3, 'text-green-500': passwordStrength === 4}">
              {{ strengthLabel }}
            </span>
          </div>
          <progress class="progress w-full h-2" [ngClass]="strengthColor" [value]="passwordStrength" max="4"></progress>
          <p class="text-xs text-gray-400 mt-1">Use uppercase, numbers, and symbols for a stronger password.</p>
        </div>

        <!-- Confirm Password -->
        <div class="form-control mb-8">
          <label class="label pb-1"><span class="label-text font-semibold">Confirm New Password</span></label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input [type]="showConfirm ? 'text' : 'password'" name="confirm" [(ngModel)]="model.confirmPassword" required
                   class="input input-bordered w-full pl-11 pr-12 focus:border-saowari-primary"
                   [ngClass]="model.confirmPassword && !passwordsMatch ? 'border-red-400' : ''"
                   placeholder="Repeat new password">
            <button type="button" (click)="showConfirm = !showConfirm" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-saowari-text-secondary">
              <i [class]="showConfirm ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <p *ngIf="model.confirmPassword && !passwordsMatch" class="text-red-400 text-xs mt-1">Passwords do not match</p>
        </div>

        <div class="flex justify-end gap-4">
          <a routerLink="/profile/dashboard" class="btn btn-ghost">Cancel</a>
          <button type="submit" [disabled]="isSaving || cpForm.invalid || !passwordsMatch || passwordStrength < 2"
                  class="btn btn-saowari gap-2 px-8 shadow-md shadow-primary/20">
            <span *ngIf="isSaving" class="loading loading-spinner loading-sm"></span>
            <i *ngIf="!isSaving" class="fas fa-shield-alt"></i>
            {{ isSaving ? 'Updating...' : 'Update Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

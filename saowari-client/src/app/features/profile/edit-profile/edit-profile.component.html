<div class="bg-saowari-surface-alt min-h-screen pt-24 pb-12">
  <div class="container mx-auto px-4 max-w-3xl">
    <div class="mb-8">
      <h1 class="text-3xl font-heading font-bold text-saowari-text-primary">Edit Profile</h1>
      <p class="text-saowari-text-secondary mt-1">Update your personal information.</p>
    </div>

    <div class="bg-saowari-surface rounded-2xl shadow-sm border border-saowari-border overflow-hidden">
      <!-- Avatar Section -->
      <div class="bg-gradient-to-r from-saowari-primary to-saowari-secondary p-8 flex flex-col sm:flex-row items-center gap-6">
        <div class="w-24 h-24 rounded-full bg-saowari-surface/30 border-4 border-white/60 flex items-center justify-center text-3xl font-bold text-white shadow-lg flex-shrink-0 overflow-hidden relative group cursor-pointer" (click)="expandPicture(model.picture)">
          <img *ngIf="model.picture" [src]="getProfilePictureUrl(model.picture)" alt="Profile" class="w-full h-full object-cover hover:scale-105 transition-transform" />
          <span *ngIf="!model.picture">{{ getInitials() }}</span>
        </div>
        <div class="text-white text-center sm:text-left flex-1">
          <h3 class="text-xl font-bold">{{ model.fullName }}</h3>
          <p class="text-white/70 text-sm mt-1">{{ model.email }}</p>
          <p class="text-white/60 text-xs mt-1">{{ model.roleName || 'Customer' }}</p>
        </div>
      </div>

      <!-- Form -->
      <div class="p-8">
        <form #editForm="ngForm" (ngSubmit)="onSave()">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Profile Picture File Upload -->
            <div class="form-control md:col-span-2">
              <label class="label pb-1"><span class="label-text font-semibold">Upload Profile Picture</span></label>
              <div class="relative">
                <input type="file" (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/jpg, image/webp"
                       class="file-input file-input-bordered w-full focus:border-saowari-primary">
              </div>
            </div>
            <div class="form-control md:col-span-2">
              <label class="label pb-1"><span class="label-text font-semibold">Full Name</span></label>
              <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" name="fullName" [(ngModel)]="model.fullName" required
                       class="input input-bordered w-full pl-11 focus:border-saowari-primary" placeholder="Your full name">
              </div>
            </div>
            <div class="form-control">
              <label class="label pb-1"><span class="label-text font-semibold">Email Address</span></label>
              <div class="relative">
                <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" name="email" [(ngModel)]="model.email" required
                       class="input input-bordered w-full pl-11 focus:border-saowari-primary bg-saowari-surface-alt" readonly>
              </div>
              <label class="label"><span class="label-text-alt text-gray-400">Email cannot be changed</span></label>
            </div>
            <div class="form-control">
              <label class="label pb-1"><span class="label-text font-semibold">Phone Number</span></label>
              <div class="relative">
                <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="tel" name="phone" [(ngModel)]="model.phone" required
                       class="input input-bordered w-full pl-11 focus:border-saowari-primary" placeholder="01XXXXXXXXX">
              </div>
            </div>
          </div>

          <div class="flex justify-end gap-4 mt-8">
            <a routerLink="/profile/dashboard" class="btn btn-ghost">Cancel</a>
            <button type="submit" [disabled]="isSaving || editForm.invalid" class="btn btn-saowari gap-2 px-8 shadow-md shadow-primary/20">
              <span *ngIf="isSaving" class="loading loading-spinner loading-sm"></span>
              <i *ngIf="!isSaving" class="fas fa-save"></i>
              {{ isSaving ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Expanded Picture Backdrop Modal -->
<div 
  *ngIf="expandedPictureUrl" 
  (click)="closeExpandedPicture()"
  class="fixed inset-0 bg-black/90 backdrop-blur-md z-[99999] flex items-center justify-center p-4 cursor-zoom-out animate-fade-in">
  <div class="relative max-w-3xl max-h-[85vh] overflow-hidden rounded-2xl border border-white/10 shadow-2xl animate-scale-up" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button 
      (click)="closeExpandedPicture()" 
      class="absolute top-4 right-4 bg-black/60 hover:bg-black/80 text-white rounded-full p-2.5 transition-colors focus:outline-none z-10">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <img [src]="expandedPictureUrl" alt="Profile Picture Expanded" class="max-w-full max-h-[80vh] object-contain rounded-xl select-none" />
  </div>
</div>

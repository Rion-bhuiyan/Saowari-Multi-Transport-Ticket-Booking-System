<div class="relative w-full h-[400px] md:h-[500px] overflow-hidden rounded-[2.5rem] shadow-xl group border border-blue-50/10">
  <!-- Dynamic Slides -->
  <div class="w-full h-full relative">
    <div *ngFor="let slide of slides; let i = index"
         class="absolute inset-0 w-full h-full transition-all duration-1000 ease-in-out transform"
         [ngClass]="i === currentIndex ? 'opacity-100 scale-100 z-10' : 'opacity-0 scale-105 pointer-events-none z-0'">
      
      <!-- Slide Image -->
      <img [src]="slide.imageUrl" [alt]="slide.title"
           class="absolute inset-0 w-full h-full object-cover object-center select-none" />
      
      <!-- Dark overlay for superior text contrast -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/35 to-black/10"></div>
      
      <!-- Text Overlay Content -->
      <div class="absolute inset-x-0 bottom-0 z-20 flex flex-col justify-end p-8 md:p-16 text-left max-w-4xl">
        <!-- Floating category badge -->
        <span class="inline-flex items-center gap-2 bg-blue-600/90 text-white text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded-full w-fit mb-4 backdrop-blur-sm shadow-md animate__animated animate__fadeInUp">
          <i class="fas fa-star text-yellow-400"></i> Bangladesh Premium Tickets
        </span>

        <!-- Title -->
        <h1 *ngIf="slide.title" class="text-3xl md:text-5xl lg:text-6xl font-extrabold text-white leading-tight mb-4 tracking-tight drop-shadow-sm animate__animated animate__fadeInUp animate__delay-1s">
          {{ slide.title }}
        </h1>
        
        <!-- Subtitle -->
        <p *ngIf="slide.subtitle" class="text-gray-200 text-sm md:text-lg lg:text-xl max-w-2xl font-medium mb-6 drop-shadow-sm animate__animated animate__fadeInUp animate__delay-1s">
          {{ slide.subtitle }}
        </p>

        <!-- CTA Link Action -->
        <a *ngIf="slide.linkUrl" [href]="slide.linkUrl" target="_blank"
           class="btn border-0 text-white font-extrabold px-8 py-3 rounded-2xl w-fit shadow-lg transform transition hover:scale-105 active:scale-95 duration-200 animate__animated animate__fadeInUp animate__delay-2s flex items-center gap-2 hover:opacity-90"
           style="background: linear-gradient(135deg, #00559F 0%, #007bf2 100%);">
          Book Now <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button (click)="prev()"
          class="absolute left-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-2xl bg-white/20 hover:bg-white/95 text-white hover:text-primary backdrop-blur-md flex items-center justify-center transition-all duration-300 opacity-0 group-hover:opacity-100 border border-white/10 shadow-lg transform -translate-x-2 group-hover:translate-x-0">
    <i class="fas fa-chevron-left text-lg"></i>
  </button>
  <button (click)="next()"
          class="absolute right-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-2xl bg-white/20 hover:bg-white/95 text-white hover:text-primary backdrop-blur-md flex items-center justify-center transition-all duration-300 opacity-0 group-hover:opacity-100 border border-white/10 shadow-lg transform translate-x-2 group-hover:translate-x-0">
    <i class="fas fa-chevron-right text-lg"></i>
  </button>

  <!-- Slider Dot Indicators -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex gap-2.5 bg-black/35 backdrop-blur-md py-2 px-4 rounded-full border border-white/5">
    <button *ngFor="let slide of slides; let i = index"
            (click)="goToSlide(i)"
            class="h-2.5 rounded-full transition-all duration-300 cursor-pointer"
            [ngClass]="i === currentIndex ? 'bg-white w-7' : 'bg-white/40 w-2.5'"
            [attr.aria-label]="'Go to slide ' + (i + 1)">
    </button>
  </div>
</div>

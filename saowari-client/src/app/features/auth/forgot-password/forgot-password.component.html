<div class="min-h-screen flex items-center justify-center bg-saowari-surface-alt p-6">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-saowari-surface rounded-2xl shadow-lg p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a routerLink="/home" class="inline-flex items-center gap-2">
          <div class="w-10 h-10 bg-saowari-primary rounded-lg flex items-center justify-center">
            <span class="text-white font-extrabold text-xl">S</span>
          </div>
          <span class="font-heading font-bold text-xl text-saowari-primary">SAOWARI</span>
        </a>
      </div>

      <!-- State: Form -->
      <div *ngIf="!emailSent">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-saowari-primary-light rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-key text-saowari-primary text-2xl"></i>
          </div>
          <h2 class="text-2xl font-heading font-bold text-saowari-text-primary mb-2">Forgot Password?</h2>
          <p class="text-saowari-text-secondary text-sm">No worries! Enter your email and we'll send you reset instructions.</p>
        </div>

        <form #forgotForm="ngForm" (ngSubmit)="onSubmit()">
          <div class="form-control mb-6">
            <label class="label pb-1"><span class="label-text font-semibold text-saowari-text-primary">Email Address</span></label>
            <div class="relative">
              <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="email" name="email" [(ngModel)]="email" required
                     class="input input-bordered w-full pl-11 focus:border-saowari-primary" placeholder="you@example.com">
            </div>
          </div>
          <button type="submit" [disabled]="isLoading || forgotForm.invalid"
                  class="btn btn-saowari w-full h-12 text-base shadow-md shadow-primary/20">
            <span *ngIf="isLoading" class="loading loading-spinner loading-sm"></span>
            <i *ngIf="!isLoading" class="fas fa-paper-plane"></i>
            {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
          </button>
        </form>
      </div>

      <!-- State: Email Sent -->
      <div *ngIf="emailSent" class="text-center py-4">
        <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
          <i class="fas fa-check-circle text-saowari-success text-4xl animate__animated animate__bounceIn"></i>
        </div>
        <h3 class="text-xl font-heading font-bold text-saowari-text-primary mb-3">Check Your Email</h3>
        <p class="text-saowari-text-secondary text-sm leading-relaxed mb-6">
          We've sent password reset instructions to <strong class="text-saowari-text-primary">{{ email }}</strong>.
          <br>Didn't receive it? Check your spam folder.
        </p>
        <button (click)="emailSent = false" class="btn btn-outline btn-primary btn-sm">
          Try a different email
        </button>
      </div>

      <p class="text-center mt-6">
        <a routerLink="/auth/login" class="text-sm text-saowari-primary font-medium hover:underline">
          <i class="fas fa-arrow-left mr-1"></i> Back to Sign In
        </a>
      </p>
    </div>
  </div>
</div>

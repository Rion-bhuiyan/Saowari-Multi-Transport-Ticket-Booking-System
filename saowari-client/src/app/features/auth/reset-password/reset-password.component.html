<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <h2>Reset Password</h2>
      <p>Enter your new password below.</p>
    </div>

    <!-- Loading overlay -->
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <!-- Success message -->
    <div *ngIf="successMessage" class="success-message text-center">
      <div class="success-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3>Password Reset Successfully!</h3>
      <p>{{ successMessage }}</p>
      <button class="btn btn-primary mt-3" routerLink="/auth/login">Return to Login</button>
    </div>

    <!-- Form -->
    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>

      <!-- New Password Input -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="newPassword" 
            formControlName="newPassword" 
            class="form-control" 
            placeholder="Enter new password"
            [ngClass]="{'is-invalid': resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid}"
          >
        </div>
        <div class="invalid-feedback" *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('required')">
          Password is required
        </div>
        <div class="invalid-feedback" *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('minlength')">
          Password must be at least 6 characters
        </div>
      </div>

      <!-- Confirm Password Input -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            class="form-control" 
            placeholder="Confirm new password"
            [ngClass]="{'is-invalid': resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid}"
          >
        </div>
        <div class="invalid-feedback" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.hasError('required')">
          Confirm Password is required
        </div>
        <div class="invalid-feedback" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('mismatch')">
          Passwords do not match
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block w-100 mt-4" 
        [disabled]="resetForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Resetting...</span>
      </button>

      <!-- Back to Login -->
      <div class="auth-footer mt-4 text-center">
        <p>Remembered your password? <a routerLink="/auth/login" class="login-link">Login here</a></p>
      </div>
    </form>
  </div>
</div>

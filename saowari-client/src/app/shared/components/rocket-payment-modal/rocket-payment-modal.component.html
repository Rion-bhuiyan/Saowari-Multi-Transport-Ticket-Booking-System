<div class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <!-- Main Modal Container -->
  <div class="bg-white w-full max-w-2xl max-h-[95vh] overflow-y-auto rounded shadow-2xl flex flex-col font-sans text-gray-900 animate-fade-in relative">
    
    <!-- Loading Overlay -->
    <div *ngIf="isLoading" class="absolute inset-0 z-50 bg-white/80 flex items-center justify-center">
      <span class="loading loading-spinner loading-lg text-[#0066cc]"></span>
    </div>

    <!-- DBBL Header -->
    <div class="p-4 md:px-8 bg-white flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- DBBL Logo Approximation -->
        <img *ngIf="logoUrl" [src]="logoUrl" alt="Rocket Logo" class="w-14 h-14 rounded-full object-contain shadow-md">
        <div *ngIf="!logoUrl" class="relative w-14 h-14 rounded-full bg-gradient-to-br from-gray-100 to-gray-300 shadow-[inset_-2px_-2px_6px_rgba(0,0,0,0.2)] flex items-center justify-center overflow-hidden border border-gray-300">
          <div class="absolute w-8 h-12 border-[5px] border-transparent border-l-[#1c357f] border-t-[#1c357f] rounded-full top-1 -left-1 transform -rotate-12"></div>
          <div class="absolute w-8 h-12 border-[5px] border-transparent border-l-[#e1231a] border-t-[#e1231a] rounded-full top-2 left-1 transform -rotate-12"></div>
          <div class="absolute w-8 h-12 border-[5px] border-transparent border-l-[#009b3e] border-t-[#009b3e] rounded-full top-3 left-3 transform -rotate-12"></div>
        </div>
        <div class="flex flex-col">
          <h1 class="text-3xl font-bold tracking-tight text-black m-0 leading-none" style="font-family: Arial, sans-serif;">Dutch-Bangla Bank</h1>
          <p class="text-[11px] uppercase tracking-[0.2em] mt-1 font-serif text-black pl-1">Your Trusted Partner</p>
        </div>
      </div>
      <!-- Right side abstract graphic from screenshot -->
      <div class="hidden md:block w-32 h-16 bg-gray-200" style="background: linear-gradient(135deg, #f3f4f6 0%, #d1d5db 50%, #9ca3af 100%); clip-path: polygon(20% 0, 100% 0, 100% 100%, 0% 100%);">
         <!-- Abstract placeholder for the right side graphic -->
         <div class="w-full h-full opacity-30 flex items-center justify-end pr-4">
           <i class="fas fa-chart-line text-4xl text-blue-800"></i>
         </div>
      </div>
    </div>

    <!-- Blue Separators -->
    <div class="w-full h-2 bg-[#0066cc] mt-2 border-y border-[#004a99]"></div>
    <div class="py-3 text-center">
      <h2 class="text-[28px] text-[#0000ff] font-sans m-0" style="font-family: Arial, sans-serif;">DBBL NEXUS GATEWAY</h2>
    </div>
    <div class="w-full h-2 bg-[#0066cc] border-y border-[#004a99] shadow-sm"></div>

    <!-- Form Content -->
    <div class="py-8 px-4 flex flex-col items-center min-h-[300px]">
      
      <h3 class="font-bold text-[17px] text-[#333] mb-6 font-sans">Mobile Account Information</h3>
      
      <div class="w-full max-w-md space-y-3 font-sans text-[15px] text-[#333]">
        
        <!-- Mobile Account -->
        <div class="flex flex-col sm:flex-row sm:items-center">
          <div class="sm:w-[160px] sm:text-right pr-2">Mobile Account</div>
          <div class="flex-1 flex gap-1 items-center">
            <input type="tel" [(ngModel)]="mobileAccount" 
                   class="flex-1 border border-gray-400 focus:outline-none focus:border-blue-500 py-1 px-2 rounded-sm" 
                   maxlength="12">
          </div>
        </div>

        <!-- PIN -->
        <div class="flex flex-col sm:flex-row sm:items-center">
          <div class="sm:w-[160px] sm:text-right pr-2">PIN</div>
          <div class="flex-1 flex gap-2 items-center">
            <input type="password" [(ngModel)]="pin" 
                   autocomplete="new-password"
                   readonly onfocus="this.removeAttribute('readonly');"
                   class="w-24 border border-gray-400 focus:outline-none focus:border-blue-500 py-1 px-2 rounded-sm" 
                   maxlength="4">
            <i class="fas fa-keyboard text-gray-700 text-xl cursor-pointer hover:text-gray-900" title="Virtual Keyboard"></i>
          </div>
        </div>

        <!-- Amount -->
        <div class="flex flex-col sm:flex-row sm:items-center pt-1">
          <div class="sm:w-[160px] sm:text-right pr-2">Amount</div>
          <div class="flex-1">{{ amount | number:'1.2-2' }}</div>
        </div>

        <!-- Currency -->
        <div class="flex flex-col sm:flex-row sm:items-center">
          <div class="sm:w-[160px] sm:text-right pr-2">Currency</div>
          <div class="flex-1">BDT</div>
        </div>

        <!-- Description -->
        <div class="flex flex-col sm:flex-row sm:items-center">
          <div class="sm:w-[160px] sm:text-right pr-2">Description</div>
          <div class="flex-1">{{ invoiceNo }}</div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-8 pt-4">
          <!-- Back Button -->
          <button (click)="onBack()" class="rocket-btn">
            <div class="rocket-btn-inner">
              <span class="rocket-btn-text">BACK</span>
            </div>
          </button>

          <!-- Submit Button -->
          <button (click)="onSubmit()" class="rocket-btn">
            <div class="rocket-btn-inner">
              <span class="rocket-btn-text">SUBMIT</span>
            </div>
          </button>

          <!-- Reset Button -->
          <button (click)="onReset()" class="rocket-btn">
            <div class="rocket-btn-inner">
              <span class="rocket-btn-text">RESET</span>
            </div>
          </button>
        </div>

      </div>

      <!-- Verified Logos -->
      <div class="flex justify-center items-center gap-6 mt-10">
        <div class="text-blue-800 font-bold text-2xl italic leading-none text-right flex flex-col justify-end">
          <span class="text-lg">VERIFIED</span>
          <span class="text-xl -mt-1">by VISA</span>
        </div>
        <div class="text-[#cc0000] font-bold text-xl leading-none italic">
          MasterCard.<br>
          <span class="text-[#ff9900]">SecureCode</span><span class="text-xs align-super">™</span>
        </div>
      </div>
      
      <div class="w-full text-left mt-4 text-[13px] font-sans">EV SSL</div>

    </div>

    <!-- Footer -->
    <div class="w-full h-[6px] bg-[#0066cc] border-y border-[#004a99]"></div>
    <div class="py-4 text-center bg-white flex flex-col items-center text-[#333] font-sans">
      <div class="font-bold text-[15px]">DBBL E-COMM With Saowari</div>
      <div class="text-[14px]">ecom.dutchbanglabank.com</div>
    </div>
  </div>
</div>
